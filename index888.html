<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招财喵 · 股票看板</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建，单文件离线可用，行情由页面直连公开行情接口获取 -->
<style>
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --line:#E6E8EB; --line2:#F0F1F3;
  --text:#1C1C1E; --text2:#6B7280; --text3:#A1A5AC;
  --up:#E13B3B; --down:#12A05C; --flat:#8A8F99;
  --accent:#007AFF; --gold:#C9922B; --goldbg:#FDF6E7;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-0.2px;}
.up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--flat);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
.board{height:100vh;padding:10px 14px;display:grid;grid-template-rows:56px 89px 132px 1fr 82px;gap:8px;}

/* ===== 顶栏 ===== */
.top{display:flex;align-items:center;padding:0 16px;gap:14px;}
.logo{width:42px;height:42px;border-radius:50%;flex:none;}
.title{font-size:19px;font-weight:600;letter-spacing:-0.3px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:5px 11px;border-radius:9px;background:#F2F3F5;color:var(--text2);}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--flat);}
.badge.live{background:#FFF1F1;color:var(--up);} .badge.live .dot{background:var(--up);animation:pulse 1.6s infinite;}
.badge.calm{background:#EAF6F0;color:#0B7A48;} .badge.calm .dot{background:#12A05C;}
.badge.off{background:#F2F3F5;color:var(--text3);} .badge.off .dot{background:var(--text3);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spacer{flex:1;}
.clockbox{display:flex;align-items:baseline;gap:11px;}
.date{font-size:14px;color:var(--text2);}
.week{font-size:14px;color:var(--text2);}
.sep{width:1px;height:13px;background:var(--line);align-self:center;}
.clock{font-size:29px;font-weight:600;letter-spacing:-0.5px;min-width:112px;text-align:right;}

/* ===== 持仓条 ===== */
.hold{display:grid;grid-template-columns:repeat(5,1fr);}
.hcell{padding:12px 18px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line2);}
.hcell:last-child{border-right:none;}
.hlabel{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;}
.hlabel .q{width:13px;height:13px;color:var(--text3);}
.hvalue{font-size:25px;font-weight:600;margin-top:4px;line-height:1.1;}
.hsub{font-size:11px;color:var(--text3);margin-top:3px;height:14px;}

/* ===== 持仓明细条 ===== */
.detail{display:grid;grid-template-columns:repeat(9,1fr);}
.dcell{padding:10px 11px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;border-right:1px solid var(--line2);}
.dcell:last-child{border-right:none;}
.d-top{display:flex;align-items:baseline;gap:6px;min-width:0;}
.d-name{font-size:14px;font-weight:600;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;color:#1C1C1E;}
.d-name.held{color:#C8931A;}
.mv-p{flex:none;font-size:11px;font-weight:700;color:#C8931A;letter-spacing:-0.2px;}
.mv-p.zero{color:#1C1C1E;}
.d-mv{display:flex;align-items:baseline;gap:4px;font-size:14px;font-weight:600;line-height:1.15;white-space:nowrap;}
.d-mv .lb{font-size:10px;color:var(--text3);font-style:normal;font-weight:500;flex:none;}
.d-mv .mv-v{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.d-qty{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-qty .lb,.d-pc .lb{font-size:10px;color:var(--text3);font-style:normal;font-weight:500;margin-right:4px;}
.d-qty .num{font-weight:600;}
.d-pc{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-pc .num{font-weight:600;letter-spacing:-0.2px;}
.d-pc .pc-p{color:var(--text2);}
.d-pc .sep{font-style:normal;margin:0 4px;color:var(--line);}
.d-pc .pc-c{color:var(--text3);}
.d-pnl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-pnl.muted{color:var(--text3);font-weight:500;}

/* ===== 股票卡片区 ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9px;}
.stock{position:relative;padding:6px 14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
.s-top{display:flex;align-items:baseline;gap:7px;}
.s-name{font-size:17px;font-weight:600;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-code{font-size:12px;color:var(--text3);flex:none;font-variant-numeric:tabular-nums;}
.tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;flex:none;letter-spacing:0.2px;}
.tag.sh{background:#FDECEC;color:#C0392B;}
.tag.sz{background:#EAF1FC;color:#1A5FBF;}
.tag.hk{background:#FFF3E0;color:#B26A00;}
.tag.us{background:#EEF0F4;color:#5A6070;}
.s-mid{margin-top:2px;}
.s-price{font-size:42px;font-weight:700;letter-spacing:-1.5px;line-height:1;}
.s-chgrow{display:flex;align-items:baseline;gap:9px;margin-top:4px;}
.s-pct{font-size:18px;font-weight:600;}
.s-chg{font-size:15px;font-weight:500;}
.s-amt{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap;}
.s-amt b{font-weight:500;}
.flash{animation:flash .7s ease-out;}
@keyframes flash{0%{background:#FFF6E5}100%{background:#fff}}

/* ===== 底部指数条 ===== */
.idx{display:grid;grid-template-columns:repeat(5,1fr);}
.icell{padding:10px 16px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line2);position:relative;overflow:hidden;}
.icell:last-child{border-right:none;}
.i-name{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.i-name .unit{font-size:10px;color:var(--text3);}
.i-row{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
.i-val{font-size:22px;font-weight:600;line-height:1;}
.i-pct{font-size:14px;font-weight:600;}
.i-chg{font-size:12px;}
.i-foot{font-size:11px;color:var(--text3);height:15px;margin-top:3px;}
</style>
</head>

/* 2026 年 A 股休市日（法定节假日，变动时直接改这里） */
var HOLIDAYS = ['2026-01-01','2026-01-02','2026-01-03','2026-02-16','2026-02-17','2026-02-18',
  '2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-04-04','2026-04-05','2026-04-06',
  '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20',
  '2026-06-21','2026-09-25','2026-09-26','2026-09-27','2026-10-01','2026-10-02','2026-10-03',
  '2026-10-04','2026-10-05','2026-10-06','2026-10-07'];

/* ============ 状态 ============ */
var state = {quotes:{}, prevPrice:{}};

/* ============ 工具 ============ */
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function thousands(n){
  var neg = n < 0; var s = Math.abs(n).toFixed(2);
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + parts.join('.');
}
function fmtAmt(v){
  var a = Math.abs(v);
  if(a >= 1e8) return (v/1e8).toFixed(2) + '亿';
  if(a >= 1e4) return (v/1e4).toFixed(2) + '万';
  return thousands(v);
}
function fmtPct(v){ if(!isFinite(v)) return '—'; return (v>0?'+':'') + v.toFixed(2) + '%'; }
function fmtMv(v){
  var a = Math.abs(v);
  if(a >= 1e8) return '¥' + (v/1e8).toFixed(2) + '亿';
  if(a >= 1e4) return '¥' + (v/1e4).toFixed(2) + '万';
  return '¥' + thousands(v);
}
function fmtChg(v){ if(!isFinite(v)) return '—'; return (v>0?'+':'') + v.toFixed(2); }
function cls(v){ return v>0 ? 'up' : (v<0 ? 'down' : 'flat'); }
function $(id){ return document.getElementById(id); }

/* ============ 计算层：交易状态 ============ */
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function minutes(d){ return d.getHours()*60 + d.getMinutes(); }
function marketState(d){
  var day = d.getDay();
  if(day === 0 || day === 6) return {live:false, text:'周末休市'};
  if(HOLIDAYS.indexOf(ymd(d)) >= 0) return {live:false, text:'节假日休市'};
  var m = minutes(d);
  if(m >= 570 && m < 585)  return {live:false, text:'集合竞价'};
  if(m >= 585 && m < 690)  return {live:true,  text:'交易中'};
  if(m >= 690 && m < 780)  return {live:false, text:'午间休市'};
  if(m >= 780 && m < 900)  return {live:true,  text:'交易中'};
  if(m >= 540 && m < 570)  return {live:false, text:'开盘前'};
  return {live:false, text:'已收盘'};
}

/* ============ 计算层：持仓汇总 ============ */
function computeHoldings(){
  var total = 0, cost = 0, costMv = 0, costed = 0, held = 0, dayPnl = 0, up = 0, down = 0, hasCost = false;
  var detail = [];
  for(var i=0;i<STOCKS.length;i++){
    var s = STOCKS[i];
    var q = state.quotes[s.sec] || SNAPSHOT[s.sec];
    var price = q ? q.p : 0;
    var qty = num(s.qty), cst = num(s.cost);
    var mv = price * qty;
    total += mv;
    var pc = q ? num(q.pc) : 0, ch = q ? num(q.ch) : 0;
    dayPnl += ch * qty;
    if(price > 0 && qty > 0){ if(pc > 0) up++; else if(pc < 0) down++; }
    if(qty > 0){ held++; if(cst > 0){ cost += cst * qty; costMv += mv; costed++; hasCost = true; } }
    detail.push({
      sec:s.sec, name:s.name, code:s.code, mkt:s.mkt,
      price:price, pct:pc, chg:ch, amt:q?num(q.amt):0, high:q?q.hi:0, low:q?q.lo:0, prev:q?q.pv:0,
      qty:qty, cost:cst, mv:mv,
      pnl: cst>0 ? (price - cst) * qty : null,
      pnlPct: cst>0 && cst>0 ? (price/cst - 1) * 100 : null
    });
  }
  var account = (total + CASH) - ORIGIN;
  var accountPct = ORIGIN > 0 ? (account / ORIGIN) * 100 : null;
  return {
    total:total, dayPnl:dayPnl, up:up, down:down, hasCost:hasCost, costed:costed, held:held,
    pnl: hasCost ? costMv - cost : null,
    pnlPct: hasCost && cost > 0 ? (costMv/cost - 1) * 100 : null,
    account:account, accountPct:accountPct,
    cash: CASH, count: STOCKS.length, detail:detail
  };
}

/* ============ 行情抓取（JSONP，file:// 直连可用） ============ */
var SEQ = 0;
function jsonp(secids, cb){
  var nm = '__emcb' + (++SEQ);
  var s = document.createElement('script');
  var done = false;
  function finish(err, res){
    if(done) return; done = true;
    clearTimeout(timer);
    try{ delete window[nm]; if(s.parentNode) s.parentNode.removeChild(s); }catch(e){}
    cb(err, res);
  }
  window[nm] = function(res){ finish(null, res); };
  s.onerror = function(){ finish(new Error('net')); };
  var timer = setTimeout(function(){ finish(new Error('timeout')); }, 9000);
  s.src = API + '&secids=' + encodeURIComponent(secids.join(',')) + '&cb=' + nm;
  document.head.appendChild(s);
}
function normalize(res){
  var out = {};
  if(!res || !res.data || !res.data.diff) return out;
  var d = res.data.diff;
  for(var i=0;i<d.length;i++){
    var it = d[i];
    var sec = (it.f13 === undefined || it.f13 === null ? '' : it.f13) + '.' + it.f12;
    var p = num(it.f2);
    if(!isFinite(p) || p <= 0) continue;
    out[sec] = {
      p:p, pc:num(it.f3), ch:num(it.f4), amt:num(it.f6),
      hi:num(it.f15), lo:num(it.f16), op:num(it.f17), pv:num(it.f18), name:it.f14
    };
  }
  return out;
}
function fetchQuotes(){
  var groups = [
    STOCKS.map(function(s){ return s.sec; }),
    INDEXES.map(function(s){ return s.sec; })
  ];
  var left = groups.length;
  groups.forEach(function(g){
    jsonp(g, function(err, res){
      left--;
      if(!err){
        var part = normalize(res);
        for(var k in part){ state.quotes[k] = part[k]; }
      }
      if(left === 0) onFetchDone();
    });
  });
}
function onFetchDone(){
  refreshAll();
  setTimeout(fetchQuotes, marketState(new Date()).live ? 3000 : 30000);
}

/* ============ 渲染层：构建骨架（只做一次） ============ */
function buildStockCards(){
  var grid = $('stockGrid');
  grid.innerHTML = '';
  state.cardEls = [];
  STOCKS.forEach(function(){
    var el = document.createElement('div');
    el.className = 'card stock';
    el.innerHTML =
      '<div class="s-top"><span class="s-name"></span><span class="s-code"></span><span class="tag"></span></div>' +
      '<div class="s-mid"><span class="s-price num"></span></div>' +
      '<div class="s-chgrow"><span class="s-pct"></span><span class="s-chg"></span><span class="s-amt"><i>成交额</i> <b class="s-amtv"></b></span></div>';
    grid.appendChild(el);
    state.cardEls.push({
      root:el, name:el.querySelector('.s-name'),
      tag:el.querySelector('.tag'), code:el.querySelector('.s-code'),
      price:el.querySelector('.s-price'), pct:el.querySelector('.s-pct'), chg:el.querySelector('.s-chg'),
      amt:el.querySelector('.s-amtv')
    });
  });
}
function buildDetailCells(){
  var row = $('detailRow');
  row.innerHTML = '';
  state.detEls = [];
  STOCKS.forEach(function(){
    var el = document.createElement('div');
    el.className = 'dcell';
    el.innerHTML =
      '<div class="d-top"><span class="d-name"></span><span class="mv-p"></span></div>' +
      '<div class="d-mv"><i class="lb">市值</i><span class="mv-v num"></span></div>' +
      '<div class="d-qty"><i class="lb">持仓</i><span class="q-v num"></span></div>' +
      '<div class="d-pc"><span class="pc-p num"></span><i class="sep">/</i><span class="pc-c num"></span></div>' +
      '<div class="d-pnl"><span class="pnl-v"></span></div>';
    row.appendChild(el);
    state.detEls.push({
      name:el.querySelector('.d-name'), mv:el.querySelector('.mv-v'), mvp:el.querySelector('.mv-p'),
      qty:el.querySelector('.q-v'), pcp:el.querySelector('.pc-p'), pcc:el.querySelector('.pc-c'), pnl:el.querySelector('.d-pnl'), pnlv:el.querySelector('.pnl-v')
    });
  });
}
function buildIndexCells(){
  var row = $('idxRow');
  row.innerHTML = '';
  state.idxEls = [];
  INDEXES.forEach(function(){
    var el = document.createElement('div');
    el.className = 'icell';
    el.innerHTML =
      '<div class="i-name"><span class="n"></span><span class="unit"></span></div>' +
      '<div class="i-row"><span class="i-val num"></span><span class="i-pct"></span><span class="i-chg"></span></div>' +
      '<div class="i-foot"><span class="i-amt"></span></div>';
    row.appendChild(el);
    state.idxEls.push({
      root:el, name:el.querySelector('.n'), unit:el.querySelector('.unit'),
      val:el.querySelector('.i-val'), pct:el.querySelector('.i-pct'), chg:el.querySelector('.i-chg'),
      amt:el.querySelector('.i-amt')
    });
  });
}

/* ============ 渲染层：各区块独立渲染，互不调用 ============ */
function renderStocks(detail){
  for(var i=0;i<state.cardEls.length;i++){
    var d = detail[i], e = state.cardEls[i];
    if(!d) continue;
    var c = cls(d.pct);
    e.name.textContent = d.name;
    e.tag.textContent = MKT_LABEL[d.mkt] || d.mkt;
    e.tag.className = 'tag ' + (MKT_CLASS[d.mkt] || 'us');
    e.code.textContent = d.code;
    e.price.textContent = d.price > 0 ? d.price.toFixed(2) : '—';
    e.price.className = 's-price num ' + c;
    e.pct.textContent = fmtPct(d.pct);
    e.pct.className = 's-pct ' + c;
    e.chg.textContent = fmtChg(d.chg);
    e.chg.className = 's-chg ' + c;
    e.amt.textContent = d.amt > 0 ? fmtAmt(d.amt) : '—';
    if(state.prevPrice[d.sec] !== undefined && Math.abs(state.prevPrice[d.sec] - d.price) > 1e-9){
      e.root.classList.remove('flash');
      void e.root.offsetWidth;
      e.root.classList.add('flash');
    }
    state.prevPrice[d.sec] = d.price;
  }
}

function renderDetail(detail, base){
  for(var i=0;i<state.detEls.length;i++){
    var d = detail[i], e = state.detEls[i];
    if(!d) continue;
    e.name.textContent = d.name;
    e.name.className = d.qty > 0 ? 'd-name held' : 'd-name';
    e.mv.textContent = d.mv > 0 ? fmtMv(d.mv) : '—';
    e.mvp.textContent = (base > 0 && d.mv > 0) ? '占' + (d.mv / base * 100).toFixed(1) + '%' : '占0.0%';
    e.mvp.className = d.qty > 0 ? 'mv-p' : 'mv-p zero';
    var pr = d.price > 0 ? d.price.toFixed(2) : '—';
    var cs = d.cost > 0 ? d.cost.toFixed(2) : '—';
    e.qty.textContent = d.qty + '股';
    e.pcp.textContent = pr;
    e.pcc.textContent = cs;
    if(d.pnl === null){
      e.pnlv.textContent = '未设成本';
      e.pnl.className = 'd-pnl muted';
    }else{
      e.pnlv.textContent = (d.pnl>0?'+':(d.pnl<0?'-':'')) + '¥' + thousands(Math.abs(d.pnl)) + ' (' + fmtPct(d.pnlPct) + ')';
      e.pnl.className = 'd-pnl ' + cls(d.pnl);
    }
  }
}

function renderIndexes(){
  for(var i=0;i<state.idxEls.length;i++){
    var it = INDEXES[i], e = state.idxEls[i];
    var q = state.quotes[it.sec] || SNAPSHOT[it.sec];
    if(!q){ e.name.textContent = it.name; e.val.textContent = '—'; continue; }
    var c = cls(q.pc);
    e.name.textContent = it.name;
    e.unit.textContent = it.unit;
    e.val.textContent = thousands(q.p);
    e.val.className = 'i-val num ' + c;
    e.pct.textContent = fmtPct(q.pc);
    e.pct.className = 'i-pct ' + c;
    e.chg.textContent = fmtChg(q.ch);
    e.chg.className = 'i-chg ' + c;
    e.amt.textContent = q.amt > 0 ? '成交额 ' + fmtAmt(q.amt) : '';
  }
}

function renderHoldings(h){
  $('vTotal').textContent = '¥' + thousands(h.total + h.cash);
  $('sTotal').textContent = '持仓 ¥' + thousands(h.total) + ' + 可用 ¥' + thousands(h.cash);
  if(h.pnl === null){
    $('vPnl').textContent = '—';
    $('vPnl').className = 'hvalue num flat';
    $('sPnl').textContent = '去设置里填成本价';
  }else{
    $('vPnl').textContent = (h.pnl>0?'+':(h.pnl<0?'-':'')) + '¥' + thousands(Math.abs(h.pnl));
    $('vPnl').className = 'hvalue num ' + cls(h.pnl);
    $('sPnl').textContent = '收益率 ' + fmtPct(h.pnlPct) + (h.held - h.costed > 0 ? ' · 另 ' + (h.held - h.costed) + ' 只未录成本' : '');
  }
  $('vDay').textContent = (h.dayPnl>0?'+':(h.dayPnl<0?'-':'')) + '¥' + thousands(Math.abs(h.dayPnl));
  $('vDay').className = 'hvalue num ' + cls(h.dayPnl);
  $('sDay').textContent = h.up + ' 涨 · ' + h.down + ' 跌';
  $('vCash').textContent = '¥' + thousands(h.cash);
  $('sCash').textContent = (h.total + h.cash) > 0 ? '占总资产 ' + ((h.cash / (h.total + h.cash)) * 100).toFixed(1) + '%' : '';
  $('vAcct').textContent = (h.account>0?'+':(h.account<0?'-':'')) + '¥' + thousands(Math.abs(h.account));
  $('vAcct').className = 'hvalue num ' + cls(h.account);
  $('sAcct').textContent = '本金 ¥' + thousands(ORIGIN) + ' · 收益 ' + fmtPct(h.accountPct);
}

function renderClock(){
  var d = new Date();
  $('dateLine').textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  $('weekLine').textContent = '星期' + ['日','一','二','三','四','五','六'][d.getDay()];
  $('clockLine').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  var st = marketState(d);
  var b = $('statusBadge');
  b.className = 'badge ' + (st.live ? 'live' : 'off');
  $('statusText').textContent = st.text;
}

/* ============ 统一刷新入口（唯一调度者） ============ */
function refreshAll(){
  var h = computeHoldings();
  renderHoldings(h);
  renderDetail(h.detail, h.total + h.cash);
  renderStocks(h.detail);
  renderIndexes();
}

/* ============ 初始化 ============ */
function init(){
  buildStockCards();
  buildDetailCells();
  buildIndexCells();
  refreshAll();
  renderClock();
  setInterval(renderClock, 1000);
  fetchQuotes();
}
init();
</script>
